name: AWS terraform apply

# main に merge された infra/aws の差分を本番へ適用する。確認用の plan は
# PR の aws-terraform-plan.yml。この workflow は承認後に plan して適用する。
#
# 承認ゲートは production environment の required reviewers。terraform-apply role の
# trust policy は sub = environment:production しか受け入れないため、承認を経ない job
# には assume の材料になる OIDC token 自体が発行されない (infra/aws/bootstrap/oidc.tf)。
#
# - environment の承認は job 起動前に来る。承認者は PR の plan を見て判断する。
#   apply は承認後に同じ commit を自分で plan し直してから適用する。
#   tfplan を artifact で渡さないのは、公開 repo の artifact は誰でも取得でき、
#   変数の実値が漏れるため。
# - infra path の merge は Terraform 差分ゼロでも承認を求め、refresh の結果を
#   state に保存するため、変更ゼロの plan も apply する。
# - apply role は state bucket に書けるので lock は通常どおり取る。
# - image_tag は state が最後に apply された値に固定する (aws-terraform-plan.yml と
#   同じ理由)。image の前進は rollout (aws-app-images.yml) の仕事で、この workflow は
#   コード差分だけを適用する。
# - workflow_dispatch は再適用と、明示digestによるrelayイメージ更新に使う。

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-terraform-apply.yml"
  workflow_dispatch:
    inputs:
      outbox_relay_image_digest:
        description: "relayの作成・更新・ロールバック先sha256 digest（空欄は現状維持）"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production

    # apply は直列。走行中の apply を新しい run が殺すと state が壊れるので
    # cancel はしない。承認追い越しは下の stale guard が受け止める。
    concurrency:
      group: vector-production-change
      cancel-in-progress: false
      queue: max

    defaults:
      run:
        working-directory: infra/aws

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # 承認待ちの間に新しい infra 変更が main に積まれた古い run を適用すると、
      # 新しい変更を巻き戻す。infra に関わる path に差分が無いことを機械的に確認する。
      - name: Ensure this run still matches the newest infra on main
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          if ! git diff --quiet HEAD FETCH_HEAD -- \
              infra/aws .github/workflows/aws-terraform-apply.yml; then
            echo "::error::main に新しい infra 変更が積まれている。この run は適用せず、最新の run を承認する"
            exit 1
          fi

      - name: Verify production environment secrets
        env:
          AWS_APPLY_ROLE_ARN: ${{ secrets.AWS_APPLY_ROLE_ARN }}
        run: |
          if [ -z "${AWS_APPLY_ROLE_ARN:-}" ]; then
            echo "::error::AWS_APPLY_ROLE_ARN is not configured in the production environment"
            exit 1
          fi

      - id: tf
        name: Read values from Terraform variables
        run: |
          set -euo pipefail
          read_default() {
            awk "/variable \"$1\"/,/^}/" variables.tf \
              | sed -n 's/.*default *= *"\(.*\)".*/\1/p' | head -1
          }
          for name in region; do
            value=$(read_default "$name")
            if [ -z "$value" ]; then
              echo "::error::variables.tf の $name の default を読めなかった"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ steps.tf.outputs.region }}

      - name: Install Terraform
        env:
          TF_VERSION: "1.15.8"
          TF_SHA256: "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d"
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/tf"
          echo "$RUNNER_TEMP/tf" >> "$GITHUB_PATH"

      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - id: image
        name: Resolve image tag from state
        run: |
          set -euo pipefail
          tag=$(
            terraform state pull \
              | jq -r '.resources[]
                  | select(.type == "aws_ecs_task_definition" and .name == "this")
                  | .instances[]
                  | select(.index_key == "api")
                  | .attributes.container_definitions' \
              | jq -r '.[0].image' \
              | sed 's/.*://'
          )
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::state から image tag を解決できなかった"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve Outbox relay image
        env:
          REQUESTED_DIGEST: ${{ inputs.outbox_relay_image_digest }}
        run: |
          set -euo pipefail
          # Terraformが読み込む設定ファイルは、生成成功後に配置する。
          relay_vars_tmp=$(mktemp ./outbox-relay-vars.XXXXXX)
          trap 'rm -f "$relay_vars_tmp"' EXIT
          terraform state pull \
            | python3 scripts/resolve-outbox-relay-image.py --digest "$REQUESTED_DIGEST" \
            > "$relay_vars_tmp"
          mv "$relay_vars_tmp" outbox-relay.auto.tfvars.json
          if [ -n "$REQUESTED_DIGEST" ]; then
            repository=$(terraform output -json ecr_repository_urls | jq -er '.backend | split("/")[1:] | join("/")')
            image=$(aws ecr describe-images --repository-name "$repository" \
              --image-ids "imageDigest=$REQUESTED_DIGEST" \
              --query 'imageDetails[0].imageDigest' --output text)
            if [ "$image" != "$REQUESTED_DIGEST" ]; then
              echo "::error::backend ECRリポジトリに指定digestが存在しない"
              exit 1
            fi
            echo "Outbox relay image: $REQUESTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          fi

      # plan → apply を 1 step で行い、tfplan を step 間でも持ち回らない。
      # 適用されるのは常にこの step 自身が plan した内容になる。
      - name: Terraform plan and apply
        env:
          TF_VAR_image_tag: ${{ steps.image.outputs.tag }}
          TF_VAR_root_domain: ${{ secrets.TF_VAR_ROOT_DOMAIN }}
          TF_VAR_frontend_domain: ${{ secrets.TF_VAR_FRONTEND_DOMAIN }}
          TF_VAR_crossref_contact_email: ${{ secrets.TF_VAR_CROSSREF_CONTACT_EMAIL }}
          TF_VAR_slack_team_id: ${{ secrets.TF_VAR_SLACK_TEAM_ID }}
          TF_VAR_slack_channel_id: ${{ secrets.TF_VAR_SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan \
            > plan.out 2>&1
          code=$?
          set -e
          sed -E 's/[0-9]{12}/<ACCOUNT_ID>/g' plan.out > plan.masked
          cat plan.masked
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::terraform plan が失敗した"
            exit 1
          fi
          set +e
          terraform apply -input=false -no-color tfplan > apply.out 2>&1
          apply_code=$?
          set -e
          sed -E 's/[0-9]{12}/<ACCOUNT_ID>/g' apply.out > apply.masked
          cat apply.masked
          if [ "$apply_code" -ne 0 ]; then
            echo "::error::terraform apply が失敗した"
            exit 1
          fi
          grep -E '^Apply complete!' apply.masked >> "$GITHUB_STEP_SUMMARY" \
            || echo "適用完了 (詳細は job log)" >> "$GITHUB_STEP_SUMMARY"
